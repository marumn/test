<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reader — Maru Manhwa</title><link rel="stylesheet" href="css/style.css"></head><body class="reader"><div class="readerbar"><div class="readerin"><a class="btn secondary" id="back">←</a><div class="grow" id="name">Reader</div><select id="chapters" class="field" style="width:auto;margin:0"></select><button class="btn secondary" id="top">↑</button></div></div><main class="pages" id="pages"></main><script type="module">import {getSeries,saveHistory,esc} from './js/app.js';import {db,FB,firebaseReady} from './js/firebase.js';import {demoPages} from './js/data.js';let sp=new URLSearchParams(location.search),sid=sp.get('series')||'solo-leveling',cid=sp.get('chapter')||'1',s=await getSeries(sid);let chapters=[];if(firebaseReady){let r=await FB.getDocs(FB.query(FB.collection(db,'series',sid,'chapters'),FB.orderBy('number','asc')));chapters=r.docs.map(d=>({id:d.id,...d.data()}))}if(!chapters.length)chapters=Array.from({length:Math.min(s.chapters||12,30)},(_,i)=>({id:String(i+1),number:i+1,pages:demoPages}));let c=chapters.find(x=>String(x.id)===String(cid))||chapters[0];name.textContent=`${s.title} — Chapter ${c.number}`;back.onclick=()=>location.href=`series.html?id=${encodeURIComponent(sid)}`;document.querySelector('#chapters').innerHTML=chapters.map(x=>`<option value="${x.id}" ${String(x.id)===String(c.id)?'selected':''}>Chapter ${x.number}</option>`).join('');document.querySelector('#chapters').onchange=e=>location.href=`reader.html?series=${encodeURIComponent(sid)}&chapter=${encodeURIComponent(e.target.value)}`;top.onclick=()=>scrollTo({top:0,behavior:'smooth'});pages.innerHTML=(c.pages||demoPages).map((p,i)=>`<img src="${esc(p)}" loading="${i<2?'eager':'lazy'}" alt="Page ${i+1}">`).join('');await saveHistory(s,c.number);</script></body></html>
