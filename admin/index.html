<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — Maru Manhwa</title><link rel="stylesheet" href="../css/style.css"></head><body><div id="nav"></div><main class="page"><div class="container"><h1>Admin</h1><div class="notice">Protect this route with Firebase custom claims / server-side authorization before using it publicly.</div><div class="adminbox"><h2>Add / update series</h2><input id="id" class="field" placeholder="series id"><input id="title" class="field" placeholder="Title"><input id="cover" class="field" placeholder="Cover URL"><input id="genres" class="field" placeholder="Genres, comma separated"><textarea id="description" class="field" placeholder="Description" rows="5"></textarea><button id="save" class="btn">Save series</button></div><div class="adminbox"><h2>Add chapter</h2><input id="sid" class="field" placeholder="Series ID"><input id="num" class="field" placeholder="Chapter number"><input id="pagesInput" class="field" placeholder="Page URLs, one per line"><button id="chapter" class="btn">Save chapter</button></div></div></main><script type="module">import {nav} from '../js/app.js';import {db,FB,auth,firebaseReady} from '../js/firebase.js';nav();save.onclick=async()=>{if(!firebaseReady||!auth.currentUser)return alert('Configure Firebase and log in.');await FB.setDoc(FB.doc(db,'series',id.value),{title:title.value,cover:cover.value,genres:genres.value.split(',').map(x=>x.trim()).filter(Boolean),description:description.value,status:'Ongoing',updatedAt:FB.serverTimestamp()},{merge:true});alert('Saved')};chapter.onclick=async()=>{if(!firebaseReady||!auth.currentUser)return alert('Configure Firebase and log in.');await FB.setDoc(FB.doc(db,'series',sid.value,'chapters',String(num.value)),{number:Number(num.value),pages:pagesInput.value.split('\n').map(x=>x.trim()).filter(Boolean),createdAt:FB.serverTimestamp()});alert('Chapter saved')};</script></body></html>
